services:
  - type: web
    name: the-halo-method
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
    headers:
      - path: /my-halo/*
        name: X-Frame-Options
        value: DENY
      - path: /my-halo
        name: X-Frame-Options
        value: DENY
      - path: /my-halo/*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /my-halo
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /my-halo/*
        name: Cache-Control
        value: private, no-store
      - path: /my-halo
        name: Cache-Control
        value: private, no-store
      - path: /
        name: X-Frame-Options
        value: DENY
      - path: /
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /
        name: Cache-Control
        value: private, no-store
